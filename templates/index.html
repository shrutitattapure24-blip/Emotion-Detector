<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emotion Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7ff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .panel {
            width: 900px;
            background: white;
            border: 2px solid #d9ddec;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }
        h1 { font-size: 36px; margin-bottom: 24px; }
        textarea {
            width: 100%;
            height: 90px;
            font-size: 18px;
            padding: 12px;
            border: 1px solid #b7bfd6;
            border-radius: 10px;
            resize: vertical;
            box-sizing: border-box;
        }
        button {
            background: #3b5bdb;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 12px 22px;
            border-radius: 10px;
            margin-top: 18px;
        }
        .result {
            margin-top: 24px;
            background: #ecf4ff;
            border: 1px solid #bcd4ff;
            border-radius: 10px;
            padding: 18px;
            font-size: 20px;
            color: #1c3a5c;
            white-space: pre-line;
        }
    </style>
</head>
<body>
    <div class="panel">
        <h1>Emotion Detector</h1>
        <form action="/emotionDetector" method="get">
            <textarea name="textToAnalyze" placeholder="Type a complete sentence here...">I am feeling very happy today</textarea>
            <div>
                <button type="submit">Analyze Emotion</button>
            </div>
        </form>
    </div>
</body>
</html>
